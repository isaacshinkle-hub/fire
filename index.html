<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fire products moved — Fire Duty Status</title>
  <meta http-equiv="refresh" content="0; url=https://firedutystatus.com/?rail=products" />
  <link rel="canonical" href="https://firedutystatus.com/?rail=products" />
  <style>
    :root { --bg:#0f1519; --card:#1b252c; --text:#f6f4ee; --muted:#b7b0a1; --accent:#e07b39; --line:#35434d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:linear-gradient(135deg,#0f1519,#1a211c); color:var(--text); line-height:1.55; }
    .wrap { max-width:720px; margin:0 auto; padding:48px 22px; }
    .card { padding:28px; border:1px solid var(--line); border-radius:18px; background:rgba(27,37,44,.94); box-shadow:0 12px 35px rgba(0,0,0,.25); }
    h1 { margin:0 0 10px; font-size:clamp(1.6rem,3.5vw,2.4rem); }
    p { color:var(--muted); margin:0 0 14px; }
    .button { display:inline-block; margin-top:8px; padding:12px 16px; border-radius:10px; background:var(--accent); color:#1b120c; text-decoration:none; font-weight:bold; }
    code { color:#ffd199; }
  </style>
  <script>location.replace("https://firedutystatus.com/?rail=products");</script>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Fire products moved</h1>
      <p>Maps, summaries, and downloads now live on <strong>Fire Duty Status → Products</strong>. This old GitHub Fire hub no longer hosts the product library.</p>
      <p><a class="button" href="https://firedutystatus.com/?rail=products">Open Products</a></p>
      <p>If you are not redirected automatically: <code>https://firedutystatus.com/?rail=products</code></p>
    </section>
  </main>
</body>
</html>
